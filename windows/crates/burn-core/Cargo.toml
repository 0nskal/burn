[package]
name = "burn-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Burn's data layer: provider limits, usage import from local session logs, pricing"

[[bin]]
name = "burn-cli"
path = "src/bin/burn-cli.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
memchr = "2.8.3"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }
