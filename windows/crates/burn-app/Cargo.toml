[package]
name = "burn-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Burn for Windows: AI subscription limits and spend in the taskbar"

[[bin]]
name = "burn"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
burn-core = { path = "../burn-core" }
burn-taskbar = { path = "../burn-taskbar" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-single-instance = "2.5"
